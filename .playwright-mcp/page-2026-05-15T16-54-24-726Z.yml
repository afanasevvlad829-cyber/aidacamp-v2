          - generic: "Смотрите на три вещи: программу (не просто игры, а реальный продукт на выходе), размер группы (у нас до 8 человек — тренер знает каждого), и лицензию (мы работаем по лицензии Минобрнауки — можно вернуть 13% через налоговый вычет). АйДаКемп — в 66 км от МКАД, Наро-Фоминский округ."
        - generic [ref=e581]:
          - button "Чем IT-лагерь отличается от обычного летнего лагеря?" [ref=e582] [cursor=pointer]:
            - generic [ref=e583]: Чем IT-лагерь отличается от обычного летнего лагеря?
          - generic: "В обычном лагере дети отдыхают. В IT-лагере — отдыхают и создают: каждый ребёнок уезжает с готовым проектом (игрой, ботом, модом или AI-приложением). При этом бассейн, спорт и вожатые тоже есть — это полноценный лагерь, а не кружок."
