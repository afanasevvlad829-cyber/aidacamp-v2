# Nginx location fragment для раздачи загруженных файлов портала.
# Включить в server-блок aidacamp-dev (или prod):
#
#   include /etc/nginx/snippets/portal-uploads.conf;
#
# Или скопировать блок вручную в /etc/nginx/sites-available/aidacamp-dev.

location /portal/uploads/ {
    alias /var/www/aidacamp-dev/uploads/portal/;
    expires 7d;
    add_header X-Content-Type-Options nosniff;
    add_header Cache-Control "public, max-age=604800, immutable";
}
