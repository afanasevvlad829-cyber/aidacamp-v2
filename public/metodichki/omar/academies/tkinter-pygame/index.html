<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Tkinter & Pygame Academy — Учим GUI и игры играя</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./enhancements.css">
<link rel="stylesheet" href="./enhancements2.css">
<link rel="stylesheet" href="./enhancements3.css">
<link rel="stylesheet" href="./kids-themes.css">
<link rel="stylesheet" href="/metodichki/omar/aida-overlay.css" data-aida-overlay></head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">🐍</div>
      <div>
        <div class="brand-title">Tkinter & Pygame</div>
        <div class="brand-sub">GUI и игры на Python</div>
      </div>
    </div>
    <input id="search" class="search" placeholder="🔎 Поиск по темам...">
    <div class="filter">
      <span class="chip active" data-level="all">Все</span>
      <span class="chip" data-level="easy">Новичок</span>
      <span class="chip" data-level="mid">Средний</span>
      <span class="chip" data-level="hard">Продвинутый</span>
    </div>
    <div id="nav-list"></div>
    <div style="margin-top:16px;display:flex;gap:6px;flex-wrap:wrap">
      <button id="theme-toggle" class="btn-ghost" style="padding:7px 12px;font-size:12px">🌓 Тема</button>
      <button id="reset" class="btn-ghost" style="padding:7px 12px;font-size:12px">♻ Сброс</button>
    </div>
  </aside>
  <main>
    <div style="padding:16px 40px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <div class="xp"><div class="xp-orb">⚡</div><div><div style="font-size:11px;color:var(--muted)">XP</div><div><strong id="xp-val">0</strong></div></div></div>
      <div style="flex:1;min-width:260px"><div class="progress"><div id="progress-bar" style="width:0%"></div></div></div>
      <div class="badge">Прогресс: <strong id="pct">0%</strong></div>
      <div class="badge" id="profile-badge">👤 Гость</div>
      <button id="edit-profile" class="btn-ghost" style="padding:7px 12px;font-size:12px">✏️ Профиль</button>
    </div>
    <div id="main" class="main"></div>
  </main>
</div>
<script src="./content.js"></script>
<script src="./examples.js"></script>
<script src="./script.js"></script>
<script src="./enhancements.js"></script>
<script src="./enhancements2.js"></script>
<script src="./enhancements3.js"></script>
<script src="./kids-themes.js"></script>
<script src="/metodichki/omar/aida-overlay.js" data-aida-overlay defer></script></body>
</html>
