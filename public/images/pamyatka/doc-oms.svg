<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f4fb"/>
      <stop offset="1" stop-color="#cfe5f3"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a73ff"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="80" y="80" width="640" height="380" rx="22" fill="url(#card)" stroke="#0d1a2b" stroke-width="0" filter=""/>
  <rect x="80" y="80" width="640" height="380" rx="22" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="3"/>
  <text x="120" y="135" font-family="Arial,sans-serif" font-size="20" fill="rgba(255,255,255,.7)" font-weight="700" letter-spacing="2">ПОЛИС</text>
  <text x="120" y="170" font-family="Arial,sans-serif" font-size="34" fill="#fff" font-weight="900" letter-spacing=".5">обязательного медицинского</text>
  <text x="120" y="205" font-family="Arial,sans-serif" font-size="34" fill="#fff" font-weight="900" letter-spacing=".5">страхования</text>

  <rect x="120" y="250" width="320" height="50" rx="8" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.2)"/>
  <text x="135" y="282" font-family="Arial,sans-serif" font-size="22" fill="#fff" font-weight="700" letter-spacing="3">0000 0000 0000 0000</text>

  <text x="120" y="340" font-family="Arial,sans-serif" font-size="14" fill="rgba(255,255,255,.55)" letter-spacing="2">ФИО ЗАСТРАХОВАННОГО</text>
  <line x1="120" y1="360" x2="600" y2="360" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
  <text x="120" y="395" font-family="Arial,sans-serif" font-size="14" fill="rgba(255,255,255,.55)" letter-spacing="2">ДАТА РОЖДЕНИЯ           ПОЛ</text>
  <line x1="120" y1="415" x2="380" y2="415" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
  <line x1="430" y1="415" x2="600" y2="415" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>

  <circle cx="640" cy="320" r="50" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="3" stroke-dasharray="4,5"/>
  <text x="640" y="328" font-family="Arial,sans-serif" font-size="14" fill="rgba(255,255,255,.7)" text-anchor="middle" font-weight="600">ЧИП</text>

  <text x="400" y="486" font-family="Arial,sans-serif" font-size="13" fill="#5e6878" text-anchor="middle" font-style="italic">Образец полиса ОМС — личные данные впишет страховая</text>
