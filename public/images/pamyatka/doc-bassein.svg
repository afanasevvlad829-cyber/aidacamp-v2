<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340">
  <rect width="520" height="340" fill="#fdfcf8" rx="4"/>
  <rect x="1" y="1" width="518" height="338" fill="none" stroke="#ccc" stroke-width="1" rx="4"/>

  <!-- Шапка -->
  <text x="340" y="22" font-family="serif" font-size="9" fill="#444" text-anchor="middle">Приложение к Приказу</text>
  <text x="340" y="33" font-family="serif" font-size="9" fill="#444" text-anchor="middle">Департамента здравоохранения</text>
  <text x="340" y="44" font-family="serif" font-size="9" fill="#444" text-anchor="middle">от 06.02.96 № 65</text>

  <!-- Заголовок -->
  <text x="260" y="72" font-family="serif" font-size="18" font-weight="bold" fill="#111" text-anchor="middle" letter-spacing="2">СПРАВКА</text>

  <!-- Поля -->
  <text x="30" y="100" font-family="serif" font-size="11" fill="#333">Выдана</text>
  <line x1="80" y1="102" x2="450" y2="102" stroke="#333" stroke-width="0.8"/>
  <text x="452" y="100" font-family="serif" font-size="11" fill="#333">20___г.</text>

  <text x="30" y="125" font-family="serif" font-size="11" fill="#333">Гр.</text>
  <line x1="48" y1="127" x2="490" y2="127" stroke="#333" stroke-width="0.8"/>

  <line x1="30" y1="152" x2="350" y2="152" stroke="#333" stroke-width="0.8"/>
  <text x="352" y="150" font-family="serif" font-size="10" fill="#333">года рождения в том, что он(а)</text>

  <text x="30" y="168" font-family="serif" font-size="11" fill="#333">допущен(а) к оздоровительному плаванию в бассейне по группе А, по группе Б.</text>

  <text x="30" y="195" font-family="serif" font-size="11" fill="#333">Анализ на энтеробиоз</text>
  <line x1="160" y1="197" x2="490" y2="197" stroke="#333" stroke-width="0.8"/>

  <text x="30" y="220" font-family="serif" font-size="11" fill="#333">Дерматолог</text>
  <line x1="110" y1="222" x2="490" y2="222" stroke="#333" stroke-width="0.8"/>

  <text x="30" y="245" font-family="serif" font-size="11" fill="#333">Терапевт</text>
  <line x1="95" y1="247" x2="490" y2="247" stroke="#333" stroke-width="0.8"/>

  <text x="30" y="272" font-family="serif" font-size="11" fill="#333">Справка действительна по «</text>
  <line x1="198" y1="274" x2="230" y2="274" stroke="#333" stroke-width="0.8"/>
  <text x="232" y="272" font-family="serif" font-size="11" fill="#333">»</text>
  <line x1="240" y1="274" x2="340" y2="274" stroke="#333" stroke-width="0.8"/>
  <text x="342" y="272" font-family="serif" font-size="11" fill="#333">20___г.</text>

  <text x="30" y="295" font-family="serif" font-size="9.5" fill="#444">Если врачом не указан срок действия справки, то медицинская виза ставится на 3 (три) месяца.</text>

  <text x="30" y="316" font-family="serif" font-size="9" fill="#555" font-style="italic">* Примечание: при наличии противопоказаний делается краткая запись «по причине заболевания»</text>

  <!-- Подпись -->
  <text x="30" y="334" font-family="serif" font-size="11" fill="#333">М.П.</text>
  <text x="300" y="334" font-family="serif" font-size="11" fill="#333">Врач</text>
  <line x1="330" y1="335" x2="490" y2="335" stroke="#333" stroke-width="0.8"/>
</svg>
