name: Evergreen refresh

# Умная пересборка по переходам смен.
#
# Сайт статический: сезонная проза («две смены», «майские прошли») вычисляется
# из дат смен на МОМЕНТ СБОРКИ (src/data/evergreen.ts). Значит между деплоями
# она может устареть — когда смена началась/закончилась, а пуша не было.
#
# Этот воркфлоу раз в день сравнивает эвергрин-сигнатуру (scripts/evergreen-state.py)
# НА СЕГОДНЯ с сигнатурой НА ДАТУ последнего успешного рана Deploy. Отличие =
# смена пересекла границу после последней сборки → диспатчит обычный Deploy
# (пересборка возьмёт свежую дату). В обычные дни не делает НИЧЕГО — не гоняет
# прод вхолостую.
#
# История (2026-08-07): раньше состояние жило марк-файлом .github/evergreen-state,
# который воркфлоу при переходе коммитил прямо в dev. 04.08 на dev включили
# branch protection (required check "quality") — пуш от GITHUB_TOKEN стал
# невозможен (GH006), воркфлоу падал 4 дня подряд. Теперь состояние не хранится
# вообще: точка отсчёта — created_at последнего успешного Deploy. Даты везде
# UTC — и created_at, и date.today() в evergreen-state.py на раннере, и
# new Date() при сборке; сравнение согласовано. Бонус против старой схемы:
# упавший деплой не теряет переход — сигнатуры расходятся, пока какой-нибудь
# деплой не пройдёт успешно.
#
# Forgejo (17.09.2026): workflow исполняет Forgejo Actions, на раннере нет `gh`
# (прогон 17.09 упал: «gh: command not found»). Вместо `gh run list` / `gh workflow
# run` — прямые вызовы Forgejo API автоматическим токеном прогона: проверено пробой,
# токен читает /actions/tasks и его dispatch реально запускает прогон. Точка отсчёта
# теперь — последний успешный job `deploy-prod` (а не любой успешный ран Deploy),
# поэтому старое слепое пятно «ручной Deploy со skip_prod засчитывался» закрыто.

on:
  schedule:
    - cron: '15 3 * * *'   # 06:15 МСК ежедневно
  workflow_dispatch:

concurrency:
  group: evergreen-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Сигнатура сегодня vs на дату последнего деплоя
        id: sig
        env:
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          NOW=$(python3 scripts/evergreen-state.py)
          LAST_DEPLOY=$(python3 - <<'PY'
          import json, os, urllib.request
          # Задачи идут от новых к старым; листаем страницами, пока не встретим
          # успешный deploy-prod (без page API отдаёт всю историю разом).
          done = []
          for page in range(1, 11):
              req = urllib.request.Request(
                  f"{os.environ['API']}/repos/{os.environ['REPO']}/actions/tasks?page={page}&limit=50",
                  headers={"Authorization": f"token {os.environ['TOKEN']}"},
              )
              runs = json.load(urllib.request.urlopen(req, timeout=30)).get("workflow_runs") or []
              done = [r.get("created_at", "") for r in runs
                      if r.get("workflow_id") == "deploy.yml"
                      and r.get("name") == "deploy-prod"
                      and r.get("status") == "success"]
              if done or not runs:
                  break
          print(max(done)[:10] if done else "")
          PY
          )
          if [ -z "$LAST_DEPLOY" ]; then
            echo "Успешных ранов Deploy не найдено — считаем, что пересборка нужна."
            THEN=none
          else
            THEN=$(python3 scripts/evergreen-state.py "$LAST_DEPLOY")
          fi
          echo "Сегодня:          $NOW"
          echo "Последний деплой: ${LAST_DEPLOY:-—} → $THEN"
          echo "now=$NOW"   >> "$GITHUB_OUTPUT"
          echo "then=$THEN" >> "$GITHUB_OUTPUT"

      - name: Переход смены? — запустить деплой
        if: steps.sig.outputs.now != steps.sig.outputs.then
        env:
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          echo "Переход: '${{ steps.sig.outputs.then }}' → '${{ steps.sig.outputs.now }}'"
          CODE=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d '{"ref":"dev"}' \
            "$API/repos/$REPO/actions/workflows/deploy.yml/dispatches")
          echo "dispatch deploy.yml@dev: HTTP $CODE"
          if [ "$CODE" != "204" ]; then
            cat /tmp/dispatch.out
            exit 1
          fi

      - name: Без изменений — пропуск
        if: steps.sig.outputs.now == steps.sig.outputs.then
        run: echo "Сигнатура не изменилась (${{ steps.sig.outputs.now }}) — деплой не нужен."
