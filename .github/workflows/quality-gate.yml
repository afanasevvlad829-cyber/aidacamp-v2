name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Кеш Astro — инкрементальный билд (Вариант B)
      # restore-keys без хеша = берём самый свежий кеш независимо от изменений
      # Astro сам решает что пересобирать на основе .astro/cache
      # Кешируем и на PR тоже: билд там теперь тоже гоняется (см. «Build site»),
      # без кеша он бы стоил ~15 мин на каждый PR.
      - name: Cache Astro build
        uses: actions/cache@v4
        with:
          path: |
            .astro
            dist
          key: astro-${{ runner.os }}-${{ hashFiles('src/**', 'public/**', 'astro.config.*', 'package-lock.json') }}
          restore-keys: |
            astro-${{ runner.os }}-

      # Невалидный workflow не падает громко — он получает startup_failure
      # и молча не выполняется. Так guard-agent-prs.yml 2.5 месяца числился
      # защитой и не срабатывал ни разу (сломан 2026-04-24, найден 2026-07-08).
      - name: Валидность workflow-файлов
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml')):
              try:
                  yaml.safe_load(open(f))
                  print(f'  OK   {f}')
              except yaml.YAMLError as e:
                  bad.append(f)
                  print(f'  FAIL {f}\n       {e}')
          if bad:
              print(f'::error::Невалидный YAML в {len(bad)} workflow — GitHub не сможет их запустить')
              sys.exit(1)
          PY

      - name: Гейт TS2304 (несуществующие переменные)
        run: npm run check:undefined

      - name: Проверка запрещённых слов
        run: npm run check:banned

      - name: Проверка цен
        run: npm run check:prices

      - name: Покрытие ключевой бизнес-логики
        run: npm run test:coverage:core

      # Полный билд — на PR ТОЖЕ, а не только при пуше.
      #
      # Инцидент 17.07.2026: #1021 убрал импорт PRICE_MIN, оставив использование
      # в .astro. На PR билд не гонялся (стояло `if: github.event_name == 'push'`),
      # грепы выше этого не видят, а гейт TS2304 гоняет tsc только по серверному
      # .ts и до .astro не достаёт. CI был зелёный → PR смержился → билд впервые
      # упал уже при пуше в dev → выкаты встали, прод замёрз на прошлой сборке.
      #
      # Билд обязан падать ДО мержа, а не после. `quality` — единственная required
      # проверка на dev, поэтому гейт живёт именно здесь: красный билд на PR теперь
      # физически не даёт смержить. С кешем Astro пересобирает только изменившееся.
      - name: Build site
        run: npm run build

      # ——— Optional: pull tooling branch and run quality scripts ———
      - name: Fetch tooling branch (best-effort)
        id: fetch_tooling
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          if git fetch origin tooling --depth=1 2>/dev/null; then
            mkdir -p .ci-tooling
            git archive origin/tooling tools | tar -x -C .ci-tooling
            chmod +x .ci-tooling/tools/*.sh || true
            echo "tooling_ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "tooling branch not available — skipping optional quality checks"
            echo "tooling_ok=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Quality metrics (informational)
        if: github.event_name == 'push' && steps.fetch_tooling.outputs.tooling_ok == '1'
        continue-on-error: true
        run: |
          if [ -x .ci-tooling/tools/quality-metrics.sh ]; then
            cp -r .ci-tooling/tools ./tools
            ./tools/quality-metrics.sh > /tmp/quality-snapshot.md || true
            echo '--- quality-metrics.sh output ---'
            cat /tmp/quality-snapshot.md || true
          fi
