name: Guard — блокировать PR от агентов напрямую в main

on:
  pull_request:
    types: [opened, reopened, edited]
    branches:
      - main

jobs:
  block-agent-pr:
    if: startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Закрыть PR и объяснить
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🚫 PR заблокирован

**Воркеры не могут делать PR напрямую в \`main\`.**

Схема: \`agent/*\` → PR → \`dev\` → PR → \`main\`

**Что сделать:**
\`\`\`bash
gh pr edit ${context.issue.number} --base dev
\`\`\`

Или пересоздай PR с правильной базой:
\`\`\`bash
gh pr create --base dev --head ${context.payload.pull_request.head.ref}
\`\`\``
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });
