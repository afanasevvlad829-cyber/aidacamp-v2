name: Guard — блокировать любой PR напрямую в main

# Исполняется Forgejo Actions (канон — Forgejo, GitHub только зеркало, с 16.09.2026).
# До 17.09.2026 шаг был на actions/github-script + инструкции через `gh` — на раннере
# Forgejo нет ни `gh`, ни GitHub API, поэтому переписан на прямые вызовы Forgejo API
# (python3 + urllib есть в образе раннера) с автоматическим токеном прогона.
#
# ⚠️ Отступы внутри `run: |` критичны.
# Базовый отступ блочного скаляра задаёт ПЕРВАЯ непустая строка. Любая строка левее —
# завершает блок, и YAML начинает парсить её как код. Именно так этот workflow был
# сломан с 2026-04-24 по 2026-07-08 (markdown-текст в первой колонке → startup_failure
# на каждом push, guard не срабатывал ни разу).
#
# Проверять перед коммитом:  python3 -c "import yaml,sys;yaml.safe_load(open(sys.argv[1]))" <этот файл>

on:
  pull_request:
    types: [opened, reopened, edited]
    branches:
      - main

jobs:
  block-pr-into-main:
    # Условия НЕТ намеренно: блокируется ЛЮБОЙ PR в main, с любой ветки.
    #
    # Раньше здесь стояло `if: startsWith(github.head_ref, 'agent/')`, и рядом —
    # комментарий, что ветки fix/*, chore/*, feat/* «не блокируются, хотя схеме
    # и не нужны». Через эту дыру и въехали: на icepartners PR #21 и #22 с веток
    # docs/* смержили прямо в main (правки README и AGENTS.md), main ушёл на
    # 2 коммита вперёд dev — и промоут `git push origin dev:main` (без форса)
    # встал на `merge-base --is-ancestor`. Прод перестал ехать. То же случилось
    # с aidacamp-mcp 13.09.2026 (PR #4/#5 в main, промоут упал 16.09).
    #
    # Легальных PR в main не существует по самой схеме: main двигает только
    # ff-промоут внутри deploy.yml, прямым push из CI, без всякого PR.
    runs-on: ubuntu-latest
    steps:
      - name: Закрыть PR и объяснить
        env:
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          api, repo, token = os.environ["API"], os.environ["REPO"], os.environ["TOKEN"]
          number, branch = os.environ["PR_NUMBER"], os.environ["HEAD_BRANCH"]

          def call(method, path, payload):
              req = urllib.request.Request(
                  f"{api}/repos/{repo}{path}",
                  data=json.dumps(payload).encode(),
                  method=method,
                  headers={"Authorization": f"token {token}", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status

          body = "\n".join([
              "## 🚫 PR заблокирован",
              "",
              "**В `main` не открывают PR — ни агенты, ни люди.**",
              "",
              "`main` продвигается только fast-forward'ом из `dev` — внутри `deploy.yml`,",
              "после зелёного smoke на dev. PR в `main` создал бы merge-коммит и развёл ветки —",
              "после чего промоут `git push origin dev:main` падает на `merge-base --is-ancestor`,",
              "и прод перестаёт ехать. Так 17.07.2026 встал icepartners, а 16.09.2026 — aidacamp-mcp.",
              "",
              "Схема: любая ветка → PR → `dev` → (автоматически) → `main` → прод",
              "",
              "**Что сделать — открыть PR с базой `dev`:**",
              "```bash",
              f"tea pr create --login aidaplus --repo {repo} --base dev --head {branch}",
              "```",
              "",
              "Или в веб-интерфейсе Forgejo: New Pull Request → merge into `dev`.",
          ])

          status = call("POST", f"/issues/{number}/comments", {"body": body})
          print(f"comment: HTTP {status}")
          status = call("PATCH", f"/pulls/{number}", {"state": "closed"})
          print(f"close: HTTP {status}")
          PY
