name: Guard — блокировать любой PR напрямую в main

# ⚠️ Отступы внутри `script: |` критичны.
# Базовый отступ блочного скаляра задаёт ПЕРВАЯ непустая строка (здесь 12 пробелов).
# Любая строка левее — завершает блок, и YAML начинает парсить её как код.
# Именно так этот workflow был сломан с 2026-04-24 по 2026-07-08: строки
# markdown-текста стояли в первой колонке, `**жирный**` читался как alias-якорь
# → `startup_failure` на каждом push, guard не срабатывал ни разу.
#
# Проверять перед коммитом:  python3 -c "import yaml;yaml.safe_load(open('.github/workflows/guard-agent-prs.yml'))"

on:
  pull_request:
    types: [opened, reopened, edited]
    branches:
      - main

jobs:
  block-pr-into-main:
    # Условия НЕТ намеренно: блокируется ЛЮБОЙ PR в main, с любой ветки.
    #
    # Раньше здесь стояло `if: startsWith(github.head_ref, 'agent/')`, и рядом —
    # комментарий, что ветки fix/*, chore/*, feat/* «не блокируются, хотя схеме
    # и не нужны». Через эту дыру и въехали: на icepartners PR #21 и #22 с веток
    # docs/* смержили прямо в main (правки README и AGENTS.md), main ушёл на
    # 2 коммита вперёд dev — и промоут `git push origin dev:main` (без форса)
    # встал на `merge-base --is-ancestor`. Прод перестал ехать. Дыра была описана
    # прозой в комментарии — и потому её никто не проверял.
    #
    # Легальных PR в main не существует по самой схеме: main двигает только
    # ff-промоут внутри deploy.yml, прямым push из CI, без всякого PR.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Закрыть PR и объяснить
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## 🚫 PR заблокирован',
                '',
                '**В `main` не открывают PR — ни агенты, ни люди.**',
                '',
                '`main` продвигается только fast-forward\'ом из `dev` — внутри',
                '[`deploy.yml`](.github/workflows/deploy.yml), после зелёного smoke на dev.',
                'PR в `main` создал бы merge-коммит и развёл ветки — после чего промоут',
                '`git push origin dev:main` падает на `merge-base --is-ancestor`, и прод',
                'перестаёт ехать. Именно так 17.07.2026 встал icepartners: два PR с веток',
                '`docs/*` смержили в `main`, и конвейер заклинило.',
                '',
                'Схема: любая ветка → PR → `dev` → (автоматически) → `main` → прод',
                '',
                '**Что сделать — переставить базу на `dev`:**',
                '```bash',
                `gh pr edit ${context.issue.number} --base dev`,
                '```',
                '',
                'Или пересоздать PR с правильной базой:',
                '```bash',
                `gh pr create --base dev --head ${branch}`,
                '```',
              ].join('\n'),
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed',
            });
