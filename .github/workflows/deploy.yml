name: Deploy aidacamp.ru (dev-стенд → промоут → прод)

# Автовыкат в восстановленной инфраструктуре (09.11.2026). Поток:
#   push в dev → deploy-dev  (сборка + выкат на dev-стенд Атласа + smoke)
#              → promote      (fast-forward main ← dev, тем же SHA)
#              → deploy-prod  (тот же артефакт с Атласа → Буран, health, автооткат)
# Триггер — ТОЛЬКО push в dev (слияние PR). push в main выкат не запускает.
#
# Приёмник выката — aida-deploy-recv (репо aidacamp-ops, buran/opt/aida-deploy): ключ
# DEPLOY_SSH_KEY привязан на хостах к одной команде и одному сайту, произвольного shell нет.
# Релиз = каталог /…/releases/aidacamp/r/<sha>, переключение ссылкой current + рестарт
# контейнера + проверка + автооткат на предыдущий релиз при красном health.
# Артефакт собирается один раз (deploy-dev) и едет в прод ровно тем же архивом.
#
# Адреса: dev-стенд http://192.168.1.43:18201/ (Атлас), прод http://192.168.1.147:18088/ (Буран, LAN).
# Релиз — рабочее дерево с prod-зависимостями (Astro SSR); секреты и DATABASE_URL живут в site.env на Буране,
# в артефакт не попадают. Dev-стенд ходит в свою копию БД на Атласе (aida-dev-aidacamp-db), не в прод-базу.
# Имя job'а прода — ровно `deploy-prod`: по нему evergreen-refresh.yml находит последний успешный выкат. Публичный DNS сайта сейчас указывает на мёртвый IP — выкат от DNS не зависит.

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      skip_prod:
        description: 'Только dev-стенд, без промоута в прод'
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-aidacamp
  cancel-in-progress: false

permissions:
  contents: write

env:
  ATLAS: vlad@192.168.1.43
  BURAN: aida@192.168.1.147
  # публичные ключи хостов (ssh-keyscan 09.11.2026)
  KNOWN_HOSTS: |
    192.168.1.147 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINEe7bGAWpR4XpJ9KLAv0sUiV8c+N6ZrGSp12HdjJsol
    192.168.1.43 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKS3F2Ni8zwBdU9J8oy8EvJ5KHw/1hT8z7l4MzkrtwgX

jobs:
  deploy-dev:
    name: Сборка + dev-стенд (Атлас) + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: SSH-ключ
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Сборка
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          SKIP_ASTRO_CHECK=1 NODE_OPTIONS=--max-old-space-size=3072 npm run build --silent
          test -f dist/server/entry.mjs && test -d dist/client
          npm prune --omit=dev --no-audit --no-fund
          tar --exclude=.git --exclude=.github --exclude='test-results' --exclude=node_modules/.cache --exclude='dist.bak*' -czf "$RUNNER_TEMP/release.tgz" .
          ls -la "$RUNNER_TEMP/release.tgz"

      - name: Выкат на dev-стенд
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15"
          $SSH "$ATLAS" "upload ${GITHUB_SHA}" < "$RUNNER_TEMP/release.tgz"
          $SSH "$ATLAS" "activate ${GITHUB_SHA}"

      - name: Smoke dev-стенда
        run: |
          set -euo pipefail
          base=http://192.168.1.43:18201
          for p in / /stati/ /robots.txt ; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$base$p")
            echo "dev $p -> $code"; [ "$code" = 200 ]
          done
          body=$(curl -fsS --max-time 15 "$base/")
          grep -qi '<title' <<<"$body"
          echo "Стенд собран из ${GITHUB_SHA}"

  promote:
    name: Fast-forward main ← dev
    needs: deploy-dev
    if: ${{ !inputs.skip_prod }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # main получает РОВНО тот SHA, что прошёл smoke. Без форса: если main не предок dev —
      # это стоп-сигнал (нужен back-merge), а не тихая перезапись.
      - name: Fast-forward main ← dev
        run: |
          set -euo pipefail
          git fetch origin main dev
          if ! git merge-base --is-ancestor origin/main origin/dev; then
            echo "::error::main не предок dev — fast-forward невозможен (нужен back-merge main→dev)"
            exit 1
          fi
          git push origin "${GITHUB_SHA}:refs/heads/main"

  deploy-prod:
    name: deploy-prod
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH-ключ
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Артефакт Атлас → Буран и активация
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15"
          $SSH "$ATLAS" "export ${GITHUB_SHA}" | $SSH "$BURAN" "upload ${GITHUB_SHA}"
          # activate сам откатывается на предыдущий релиз при красном health и возвращает код 1
          $SSH "$BURAN" "activate ${GITHUB_SHA}"

      - name: Smoke прода
        run: |
          set -euo pipefail
          base=http://192.168.1.147:18088
          for p in / /stati/ /robots.txt ; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$base$p")
            echo "prod $p -> $code"; [ "$code" = 200 ]
          done
          echo "Прод aidacamp.ru (LAN) на ${GITHUB_SHA}"
