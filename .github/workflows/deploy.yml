name: Deploy to Server

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Введите "deploy" для подтверждения деплоя на ПРОД'
        required: true
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: github.event.inputs.confirm != 'deploy'
        run: |
          echo "❌ Отменено: введите 'deploy' для подтверждения"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: Cloude

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/aidacamp
            git fetch origin
            git checkout Cloude
            git pull origin Cloude
            npm ci --production
            npm run build
            pm2 restart aidacamp || pm2 start npm --name aidacamp -- run preview -- --host 0.0.0.0 --port 3000
            pm2 save
