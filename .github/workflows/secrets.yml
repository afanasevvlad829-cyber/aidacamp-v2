# Проверка на секреты в новых коммитах PR (gitleaks), 30.09.2026.
#
# Зачем: сверка 30.09.2026 нашла 39 серверных файлов с вшитыми паролями и ключами
# (пароль БД, ключи Immich/ElevenLabs/Green-API/S3, токены ботов и OAuth Яндекса)
# и ещё ~15 настоящих секретов в репо. Ключ, попавший в git, остаётся в истории и в
# зеркале на GitHub — его приходится перевыпускать. Дешевле не пустить.
#
# Проверяются ТОЛЬКО коммиты этого PR (base..HEAD), а не вся история: старые находки
# разбираются отдельно и не блокируют работу. Ложное срабатывание на строке —
# комментарий `gitleaks:allow` в конце этой строки.
name: secrets

on:
  pull_request:
    branches: [dev, main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks — новые коммиты PR
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          git fetch -q origin "${BASE_REF}"
          /tmp/gitleaks git --no-banner --redact --exit-code 1 \
            --log-opts="origin/${BASE_REF}..HEAD" .
