# Promptfoo regression tests for АйДаКемп AI bot
# Run: npx promptfoo eval --config tests/promptfoo.yaml
# Docs: https://promptfoo.dev/docs

description: "АйДаКемп bot factual accuracy regression suite"

# HTTP provider — вызывает реальный API бота
providers:
  - id: https
    config:
      url: https://dev.aidacamp.ru/api/ask
      method: POST
      headers:
        Content-Type: application/json
      body:
        message: "{{message}}"
        history: []
      transformResponse: "json.text"

# Prompt — передаём сообщение переменной из теста
prompts:
  - "{{message}}"

# Судья для llm-rubric — используем Claude Haiku, ключ из env
defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-haiku-4-5-20251001
      config:
        apiKey: ${ANTHROPIC_API_KEY}

tests:
  # ── ЦЕНЫ ────────────────────────────────────────────────────────────
  - description: "Цена Смены 1"
    vars:
      message: "Сколько стоит первая смена?"
    assert:
      - type: contains
        value: "74"
      - type: llm-rubric
        value: "Ответ содержит цену 74 900 рублей или 74900. Не называет другую сумму."

  - description: "Цена Смены 2"
    vars:
      message: "Почём Смена 2?"
    assert:
      - type: contains
        value: "95"
      - type: llm-rubric
        value: "Ответ содержит цену 95 000 рублей. Не называет другую сумму."

  - description: "Цена Смены 2.1"
    vars:
      message: "Что такое смена 2.1, сколько стоит?"
    assert:
      - type: contains
        value: "48"
      - type: llm-rubric
        value: "Ответ содержит цену 48 000 рублей. Называет 7 дней или с 10 по 16 июня."

  - description: "Цена Смены 3"
    vars:
      message: "Смена 3 цена"
    assert:
      - type: contains
        value: "89"
      - type: llm-rubric
        value: "Ответ содержит цену 89 400 рублей. Не называет другую сумму."

  - description: "Смена 4 — мест нет"
    vars:
      message: "Хочу на смену 4 в августе"
    assert:
      - type: llm-rubric
        value: "Ответ сообщает что мест нет или смена закрыта. Не предлагает забронировать смену 4."

  # ── ДАТЫ ────────────────────────────────────────────────────────────
  - description: "Даты Смены 1"
    vars:
      message: "Когда первая смена?"
    assert:
      - type: llm-rubric
        value: "Ответ называет конец мая или 30 мая или 8 июня. Не называет другие даты."

  - description: "Июль — смен нет"
    vars:
      message: "Есть ли смены в июле?"
    assert:
      - type: llm-rubric
        value: "Ответ явно говорит что в июле смен нет. Объясняет что места раскупают заранее или в декабре."
      - type: not-contains
        value: "июль"
        transform: "output.toLowerCase().includes('есть смена') || output.toLowerCase().includes('в июле проходит')"

  - description: "Длительность Смены 2"
    vars:
      message: "На сколько дней рассчитана смена 2?"
    assert:
      - type: contains
        value: "14"
      - type: llm-rubric
        value: "Ответ называет 14 дней."

  # ── НАЛОГОВЫЙ ВЫЧЕТ ─────────────────────────────────────────────────
  - description: "Вычет — правильная сумма"
    vars:
      message: "Сколько можно вернуть через налоговый вычет?"
    assert:
      - type: llm-rubric
        value: "Ответ называет сумму возврата от 2800 до 5500 рублей. НЕ называет 8000, 10000, 12000, половину стоимости или 13% от полной цены путёвки."

  - description: "Вычет — процент правильный"
    vars:
      message: "Какой процент налогового вычета?"
    assert:
      - type: contains
        value: "13"
      - type: llm-rubric
        value: "Ответ говорит 13% от образовательной части. НЕ говорит 13% от полной стоимости путёвки."

  - description: "Кешбэк через Госуслуги"
    vars:
      message: "Есть ли кешбэк?"
    assert:
      - type: contains
        value: "15"
      - type: llm-rubric
        value: "Ответ упоминает кешбэк 15% через Госуслуги. Не путает с налоговым вычетом 13%."

  # ── ОПЛАТА ──────────────────────────────────────────────────────────
  - description: "Схема оплаты 50+50"
    vars:
      message: "Как оплачивается?"
    assert:
      - type: contains
        value: "50%"
      - type: llm-rubric
        value: "Ответ говорит 50% при подписании договора и 50% за 3 недели до смены. НЕ называет бронь 1000 рублей."

  - description: "Скидка при 100% оплате"
    vars:
      message: "Есть ли скидка если оплачу сразу всё?"
    assert:
      - type: contains
        value: "5%"
      - type: llm-rubric
        value: "Ответ говорит о скидке 5% при полной оплате в течение 2-3 дней."

  - description: "Рассрочка — через банк"
    vars:
      message: "Можно ли оплатить в рассрочку?"
    assert:
      - type: llm-rubric
        value: "Ответ говорит что лагерь сам рассрочку не предоставляет. Рекомендует банк (Сбер, Тинькофф). НЕ говорит что рассрочка доступна."

  # ── РЕФЕРАЛЬНАЯ ПРОГРАММА ──────────────────────────────────────────
  - description: "Реферал 1 друг"
    vars:
      message: "Если приведу подругу, дадите скидку?"
    assert:
      - type: contains
        value: "10%"
      - type: llm-rubric
        value: "Ответ говорит о скидке 10% обоим при приводе 1 друга."

  - description: "Реферал 5 человек"
    vars:
      message: "Какие скидки за приглашение друзей?"
    assert:
      - type: llm-rubric
        value: "Ответ упоминает: 1 друг — 10% обоим, 5 человек — 50% скидка, 10 человек — путёвка за 100 рублей."

  # ── ВОЖАТЫЕ ─────────────────────────────────────────────────────────
  - description: "Соотношение вожатых"
    vars:
      message: "Сколько детей на одного вожатого?"
    assert:
      - type: contains
        value: "8"
      - type: llm-rubric
        value: "Ответ говорит 1 вожатый на 8 детей. НЕ называет другое число."

  - description: "Где спят вожатые"
    vars:
      message: "Вожатые спят в комнате с детьми?"
    assert:
      - type: llm-rubric
        value: "Ответ говорит что вожатые живут в отдельной вожатской на том же этаже. НЕ говорит что спят в одной комнате с детьми."

  - description: "Проживание детей"
    vars:
      message: "По сколько человек живут в комнате?"
    assert:
      - type: llm-rubric
        value: "Ответ называет 2-4 человека в комнате."

  # ── ТЕЛЕФОНЫ ────────────────────────────────────────────────────────
  - description: "Телефонное время — час"
    vars:
      message: "Когда можно звонить ребёнку?"
    assert:
      - type: contains
        value: "19:00"
      - type: llm-rubric
        value: "Ответ говорит что телефонное время в 19:00 ежедневно, до 60 минут или до часа."

  - description: "Телефоны сдаются"
    vars:
      message: "Ребёнок может пользоваться телефоном в лагере?"
    assert:
      - type: llm-rubric
        value: "Ответ объясняет что телефоны сдаются при заезде. Телефонное время каждый вечер в 19:00."

  # ── ТРАНСФЕР ────────────────────────────────────────────────────────
  - description: "Откуда автобус"
    vars:
      message: "Откуда едет автобус?"
    assert:
      - type: llm-rubric
        value: "Ответ называет станцию метро Солнцево."

  - description: "Время отправления"
    vars:
      message: "Во сколько автобус?"
    assert:
      - type: llm-rubric
        value: "Ответ называет около 9:00 или 9 утра."

  - description: "Трансфер входит в стоимость"
    vars:
      message: "Трансфер платный?"
    assert:
      - type: llm-rubric
        value: "Ответ говорит что трансфер включён в стоимость путёвки, не нужно платить отдельно."

  # ── АДРЕС / РАССТОЯНИЕ ──────────────────────────────────────────────
  - description: "Расстояние от Москвы"
    vars:
      message: "Далеко ли лагерь от Москвы?"
    assert:
      - type: contains
        value: "66"
      - type: llm-rubric
        value: "Ответ называет 66 км от МКАД по Калужскому шоссе."

  # ── МЕДИЦИНА ────────────────────────────────────────────────────────
  - description: "Медицина — медсестра"
    vars:
      message: "Есть ли врач в лагере?"
    assert:
      - type: llm-rubric
        value: "Ответ говорит медсестра круглосуточно. НЕ говорит 'врач на месте' или 'скорая на территории'."

  - description: "Больница рядом"
    vars:
      message: "Что если ребёнок заболеет?"
    assert:
      - type: contains
        value: "15"
      - type: llm-rubric
        value: "Ответ упоминает больницу в 15 минутах."

  # ── ОПЫТ ЛАГЕРЯ ─────────────────────────────────────────────────────
  - description: "Сколько лет работает лагерь"
    vars:
      message: "Как давно существует лагерь?"
    assert:
      - type: contains
        value: "6"
      - type: llm-rubric
        value: "Ответ говорит 6 лет работы. НЕ говорит 3, 4, 5 лет или '3 сезона'."

  - description: "Сколько детей прошло"
    vars:
      message: "Сколько детей у вас уже отдохнуло?"
    assert:
      - type: contains
        value: "1 200"
      - type: llm-rubric
        value: "Ответ называет более 1200 детей."

  # ── ВОЗРАСТ ─────────────────────────────────────────────────────────
  - description: "Возрастной диапазон"
    vars:
      message: "Дети какого возраста могут поехать?"
    assert:
      - type: llm-rubric
        value: "Ответ говорит 7-16 лет. НЕ говорит 'до 15' или 'от 8'."

  - description: "Scratch для 7 лет"
    vars:
      message: "Сыну 7 лет, что ему подойдёт?"
    assert:
      - type: llm-rubric
        value: "Ответ рекомендует Scratch. Не рекомендует Python или Unity для 7-летнего."

  - description: "Курс для 10 лет"
    vars:
      message: "Дочке 10 лет, что выбрать?"
    assert:
      - type: llm-rubric
        value: "Ответ рекомендует Python или Minecraft. Не рекомендует Кибербезопасность."

  - description: "Курс для 14 лет"
    vars:
      message: "Сыну 14, интересуется компами"
    assert:
      - type: llm-rubric
        value: "Ответ рекомендует Python, Unity, Кибербезопасность или AI-проекты для 14-летнего."

  # ── ПИТАНИЕ ─────────────────────────────────────────────────────────
  - description: "Питание 4 раза в день"
    vars:
      message: "Сколько раз в день кормят?"
    assert:
      - type: contains
        value: "4"
      - type: llm-rubric
        value: "Ответ говорит 4 раза в день. НЕ говорит 3 раза."

  # ── ХАКАТОН ─────────────────────────────────────────────────────────
  - description: "Хакатон — последние 2 дня"
    vars:
      message: "Что такое хакатон в лагере?"
    assert:
      - type: llm-rubric
        value: "Ответ говорит последние 2 дня каждой смены. НЕ говорит 3 дня или весь последний день."

  # ── ДОКУМЕНТЫ ───────────────────────────────────────────────────────
  - description: "Документы для заезда"
    vars:
      message: "Какие документы нужны для заезда?"
    assert:
      - type: llm-rubric
        value: "Ответ называет справку 079/у и свидетельство о рождении или паспорт ребёнка."

  - description: "Документы для договора"
    vars:
      message: "Что нужно для заключения договора?"
    assert:
      - type: llm-rubric
        value: "Ответ называет паспорт родителя и свидетельство о рождении ребёнка."

  - description: "Договор — шаблон PDF"
    vars:
      message: "Можно посмотреть договор заранее?"
    assert:
      - type: llm-rubric
        value: "Ответ говорит что оферты нет, но есть шаблон PDF. Даёт ссылку на PDF или упоминает aidacamp.ru."

  - description: "Брони за 1000 рублей нет"
    vars:
      message: "Можно забронировать за 1000 рублей?"
    assert:
      - type: llm-rubric
        value: "Ответ говорит что брони за 1000 рублей нет. Это была старая система. Сейчас схема 50%+50%."

  # ── ОПЫТ РЕБЁНКА ────────────────────────────────────────────────────
  - description: "Нужен ли опыт"
    vars:
      message: "Ребёнок никогда не программировал, возьмёте?"
    assert:
      - type: llm-rubric
        value: "Ответ говорит что опыт не нужен, начинают с нуля."

  - description: "Нужен ли ноутбук"
    vars:
      message: "Нужно брать свой ноутбук?"
    assert:
      - type: llm-rubric
        value: "Ответ говорит что ноутбук не нужен, всё оборудование предоставляется."

  # ── БАССЕЙН / АКТИВНОСТИ ────────────────────────────────────────────
  - description: "Бассейн каждый день"
    vars:
      message: "Есть ли бассейн?"
    assert:
      - type: llm-rubric
        value: "Ответ говорит что бассейн есть и открытый, каждый день."

  # ── БЕЗОПАСНОСТЬ ────────────────────────────────────────────────────
  - description: "Охрана территории"
    vars:
      message: "Безопасно ли? Охрана есть?"
    assert:
      - type: llm-rubric
        value: "Ответ упоминает охрану 24/7 или закрытую территорию."

  # ── TELEGRAM-КАНАЛ ──────────────────────────────────────────────────
  - description: "Фото для родителей"
    vars:
      message: "Как я буду знать что с ребёнком всё хорошо?"
    assert:
      - type: llm-rubric
        value: "Ответ упоминает Telegram-канал смены и ежедневные фото/видео."

  # ── ВОЗВРАТ ─────────────────────────────────────────────────────────
  - description: "Возврат денег"
    vars:
      message: "Если передумаем, деньги вернут?"
    assert:
      - type: llm-rubric
        value: "Ответ говорит что за 30+ дней полный возврат."

  # ── ГЕНДЕР ──────────────────────────────────────────────────────────
  - description: "Гендер — дочь"
    vars:
      message: "У меня дочка 11 лет, что ей подойдёт?"
    assert:
      - type: llm-rubric
        value: "Ответ использует местоимение 'она' или 'ей'. НЕ использует 'он' или 'ему' применительно к ребёнку."

  - description: "Гендер — сын"
    vars:
      message: "Сыну 12 лет, какой курс лучше?"
    assert:
      - type: llm-rubric
        value: "Ответ использует местоимение 'он' или 'ему'. НЕ говорит 'она'."

  # ── ТОНАЛЬНОСТЬ / СТИЛЬ ─────────────────────────────────────────────
  - description: "Нет эмодзи"
    vars:
      message: "Расскажите о лагере"
    assert:
      - type: javascript
        value: "!output.match(/[\\u{1F000}-\\u{1FFFF}\\u{2600}-\\u{27BF}]/u)"

  - description: "Нет педагогических терминов"
    vars:
      message: "Что даст ребёнку лагерь?"
    assert:
      - type: llm-rubric
        value: "Ответ НЕ содержит слов: soft-skills, компетенции, фундамент знаний, социализация, формирование. Говорит на простом языке."

  - description: "Обращение на Вы"
    vars:
      message: "Хочу узнать про лагерь"
    assert:
      - type: llm-rubric
        value: "Ответ обращается к маме на 'Вы' с заглавной. НЕ использует 'ты' применительно к маме."
